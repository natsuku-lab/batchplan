name: Release

# Version tags publish to crates.io and PyPI after the Python distributions pass their tests.
# Pull requests and manual runs build the distributions without publishing.
on:
  push:
    tags: ['v*']
  pull_request:
    paths:
      - '.github/workflows/release.yml'
      - 'python/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  versions:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Check package names, versions and release tag
        run: |
          python - <<'PY'
          import os
          import pathlib
          import tomllib

          def manifest(path):
              return tomllib.loads(pathlib.Path(path).read_text())

          version = manifest('Cargo.toml')['package']['version']
          assert manifest('python/Cargo.toml')['package']['version'] == version, \
              'Rust and Python crate versions must match'
          assert manifest('python/pyproject.toml')['project']['name'] == 'batches', \
              'The Python distribution must be named batches'
          if os.environ['GITHUB_REF_TYPE'] == 'tag':
              assert os.environ['GITHUB_REF_NAME'] == f'v{version}', \
                  'The release tag must name the crate version'
          print(f'Release version: {version}')
          PY

  # A patch must break nothing. The check builds the crate's dependencies afresh, outside the
  # lockfile, so it runs apart from the job that can publish.
  semver:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-semver-checks@0.51.0
      # Against the latest release on crates.io at or below this version, pre-releases skipped.
      - run: cargo semver-checks

  wheels:
    needs: versions
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64
          - os: ubuntu-24.04-arm
            target: aarch64
          - os: macos-15-intel
            target: x86_64
          - os: macos-15
            target: aarch64
          - os: windows-2025
            target: x86_64
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@v10.3.3
      - name: Build wheel
        uses: PyO3/maturin-action@v1
        with:
          maturin-version: v1.16.0
          working-directory: python
          target: ${{ matrix.target }}
          manylinux: '2_28'
          args: --release --locked --out ../dist
      - name: Install Vulkan software driver
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y mesa-vulkan-drivers libvulkan1
      - name: Test the built wheel
        run: uv run --no-project --with dist/*.whl --with pytest python -m pytest python/tests
        env:
          BATCHPLAN_REQUIRE_GPU: ${{ runner.os == 'Linux' && '1' || '' }}
      - uses: actions/upload-artifact@v7
        with:
          name: python-${{ matrix.os }}-${{ matrix.target }}
          path: dist/*.whl
          if-no-files-found: error

  sdist:
    needs: versions
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
      - name: Build source distribution
        uses: PyO3/maturin-action@v1
        with:
          maturin-version: v1.16.0
          working-directory: python
          command: sdist
          args: --out ../dist
      - name: Check package metadata
        run: uvx --from twine twine check dist/*
      - name: Install Vulkan software driver
        run: sudo apt-get update && sudo apt-get install -y mesa-vulkan-drivers libvulkan1
      - name: Test an installation from source
        run: uv run --no-project --python 3.12 --with dist/*.tar.gz --with pytest python -m pytest python/tests
        env:
          BATCHPLAN_REQUIRE_GPU: 1
      - uses: actions/upload-artifact@v7
        with:
          name: python-sdist
          path: dist/*.tar.gz
          if-no-files-found: error

  publish:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [versions, semver, wheels, sdist]
    runs-on: ubuntu-24.04
    environment: release
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - name: Check that the tag names the crate's version
        run: test "$GITHUB_REF_NAME" = "v$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].version')"
      - uses: rust-lang/crates-io-auth-action@v1
        id: auth
      - run: cargo publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}

  pypi:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: publish
    runs-on: ubuntu-24.04
    environment:
      name: release
      url: https://pypi.org/project/batches/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: python-*
          merge-multiple: true
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1
