[package]
name = "batchplan"
version = "0.1.1"
edition = "2024"
rust-version = "1.90"
description = "Batched, collision-aware robot motion generation: IK, motion planning and training data for thousands of problems at once, on any GPU (wgpu) or CPU threads"
license = "MIT OR Apache-2.0"
repository = "https://github.com/natsuku-lab/batchplan"
keywords = ["robotics", "motion-planning", "inverse-kinematics", "gpu", "lerobot"]
categories = ["science::robotics", "algorithms"]
exclude = [".github/", "CLAUDE.md", "rust-toolchain.toml"]

[package.metadata.docs.rs]
features = ["lerobot", "usd"]

[dependencies]
anyhow = "1"
bytemuck = { version = "1", features = ["derive"] }
fearless_simd = "1.1"
glam = { version = "0.33", features = ["serde"] }
half = "2"
mesh-loader = "0.1"
parry3d = { version = "0.31", default-features = false, features = ["required-features", "std", "alloc"] }
pollster = { version = "1", optional = true }
rayon = "1"
roxmltree = "0.21"
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
thiserror = "2"
urdf-rs = "0.10"
wgpu = { version = "30", optional = true }
openusd = { version = "=0.7.0", optional = true }
openusd-schemas = { version = "=0.7.0", optional = true, features = ["geom"] }
arrow-array = { version = "60", optional = true }
arrow-schema = { version = "60", optional = true }
parquet = { version = "60", optional = true, default-features = false, features = ["arrow", "snap"] }

[features]
default = ["gpu"]
# Run batches on GPUs through wgpu. Without it, only `Device::cpu` works, for boards without one.
gpu = ["dep:wgpu", "dep:pollster"]
# Export demonstrations as LeRobot v3.0 datasets (adds the Arrow/Parquet dependencies).
lerobot = ["dep:arrow-array", "dep:arrow-schema", "dep:parquet"]
# Load robots and scenes from OpenUSD (adds the pure-Rust openusd crates, which need Rust 1.96).
usd = ["dep:openusd", "dep:openusd-schemas"]

# Every build warns on these; CI denies warnings.
[lints.clippy]
all = { level = "warn", priority = -1 }
# Rules of Google's Rust style guide that clippy checks.
wildcard_imports = "warn"
enum_glob_use = "warn"
needless_for_each = "warn"
undocumented_unsafe_blocks = "warn"
format_push_string = "warn"
redundant_clone = "warn"
ref_option = "warn"

[profile.release]
debug = 1

[profile.test]
opt-level = 3

[dev-dependencies]
serde-saphyr = "1.3"

[target.'cfg(target_os = "macos")'.dev-dependencies]
libc = "0.2"

[[example]]
name = "usd_fk"
required-features = ["usd"]
