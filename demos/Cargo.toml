# Visual demos in Rerun, a crate of their own so the library never depends on the viewer.
[package]
name = "batchplan-demos"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
anyhow = "1"
batchplan = { path = ".." }
rayon = "1"
serde_json = "1"
rerun = { version = "=0.38.1", default-features = false, features = ["sdk"] }
urdf-rs = "0.10"

[lints.clippy]
all = { level = "warn", priority = -1 }
# Rules of Google's Rust style guide that clippy checks, as in the library.
wildcard_imports = "warn"
enum_glob_use = "warn"
needless_for_each = "warn"
undocumented_unsafe_blocks = "warn"
format_push_string = "warn"
redundant_clone = "warn"
ref_option = "warn"
# Bun's rules that the library keeps too.
todo = "warn"
unimplemented = "warn"
dbg_macro = "warn"
needless_collect = "warn"
or_fun_call = "warn"
implicit_clone = "warn"
assigning_clones = "warn"
allow_attributes_without_reason = "warn"
# The root clippy.toml bans reading the environment in the library; demos may.
disallowed_methods = "allow"

[profile.release]
debug = 1
