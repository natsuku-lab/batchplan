# What depth cameras show, as objects: a crate of its own, so the library never depends on it. It
# takes batchplan's depth images, poses and obstacles, and a look runs on a batchplan device.
[package]
name = "miru"
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
description = "What depth cameras show, as objects: which pixels are one thing, which object is which from look to look, its shape and what it rests on"
publish = false

[dependencies]
batchplan = { path = "..", default-features = false }
glam = { workspace = true }
rayon = "1"

[lints]
workspace = true

[dev-dependencies]
# The examples read recorded looks (`look.json`) and write label images. The library itself
# depends on neither.
serde_json = "1"
png = "0.18"

[target.'cfg(target_os = "macos")'.dev-dependencies]
libc = "0.2"

# The scorer's own rules have tests, which `cargo test` runs with the library's.
[[example]]
name = "score"
test = true
