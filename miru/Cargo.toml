# What depth cameras show, as objects: a crate of its own, so the library never depends on it. It
# takes batchplan's depth images, poses and obstacles, and a look runs on a batchplan device.
# Published as `batchplan-miru` (the name `miru` was taken), with batchplan's version and in the
# same release; its library is still `miru`.
[package]
name = "batchplan-miru"
version.workspace = true
edition = "2024"
rust-version = "1.90"
description = "Perception for batchplan: what depth cameras show, as objects. Which pixels are one thing, which object is which from look to look, its shape and what it rests on"
license = "MIT OR Apache-2.0"
repository = "https://github.com/natsuku-lab/batchplan"
readme = "README.md"
keywords = ["robotics", "perception", "depth-camera", "segmentation", "point-cloud"]
categories = ["science::robotics", "computer-vision"]
# The library and the README, its page on crates.io. The tests and the scorer read the
# repository's robots and recorded looks, which the package does not hold.
include = ["/src/", "/README.md", "/LICENSE-MIT", "/LICENSE-APACHE"]

[lib]
name = "miru"

[dependencies]
batchplan = { workspace = true }
glam = { workspace = true }
rayon = "1"

[features]
# A look on batchplan's GPU device as well, in `tests/batchplan.rs`: miru itself runs on any
# device's threads and needs nothing of the GPU's.
gpu = ["batchplan/gpu"]

[lints]
workspace = true

[dev-dependencies]
# The examples read recorded looks (`look.json`) and write label images. The library itself
# depends on neither.
serde_json = "1"
png = "0.18"

[target.'cfg(target_os = "macos")'.dev-dependencies]
libc = "0.2"

# The scorer's own rules have tests, which `cargo test` runs with the library's.
[[example]]
name = "score"
test = true
